---
version: "2"
sql:
  - engine: sqlite
    queries: sql/query
    schema: sql/schema
    gen:
      go:
        package: queries
        out: internal/queries
        overrides:
          - column: counterparties.aliases
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          - column: accounts.sms_refs
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          - column: categories.kinds
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          - column: gamyaas.turns
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          - column: wishlist_items.installment_plan
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          - column: goals.plan
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          - column: sms_templates.senders
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          - column: sms_templates.fixed
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          # Nullable: recurrent txs without a category get NULL from the view.
          - column: recurrent_txs_details.category_kinds
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
  - engine: sqlite
    queries: sql/shared/query
    schema: sql/shared/schema
    gen:
      go:
        package: sharedqueries
        out: internal/sharedqueries
        overrides:
          - column: sms_templates.senders
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
          - column: sms_templates.fixed
            go_type:
              import: github.com/omareloui/tyche/internal/dbtypes
              type: JSON
