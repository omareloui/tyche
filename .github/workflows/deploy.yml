---
name: Deploy to ECS

on:
  push:
    branches:
      - main

# One deploy at a time: a newer push waits (replacing an older one waiting).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # The ECS host is a t4g (arm64).
    runs-on: ubuntu-24.04-arm
    environment: Production
    env:
      HEALTH_URL: https://tychefortune.com/health

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Layers cached in the GitHub Actions cache: a change to the code only
      # rebuilds from copying it in (the go modules, the cgo SQLCipher driver,
      # sqlc and the npm packages are kept).
      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/package/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      # Not waiting for ECS to call the service stable: it takes minutes
      # after the new task is up. The next step waits for the new commit to
      # be served instead; a task failing to start is still rolled back by
      # the deployment circuit breaker.
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          desired-count: 1
          wait-for-service-stability: false

      - name: Wait for the new commit to be served
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          for i in $(seq 1 120); do
            commit=$(curl -fsS --max-time 5 "$HEALTH_URL" | jq -r .commit 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "serving $commit"
              exit 0
            fi
            if [ $((i % 6)) -eq 0 ]; then
              # A failed deployment stays listed while it's rolled back.
              failed=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query "length(services[0].deployments[?rolloutState=='FAILED'])" --output text)
              if [ "$failed" != 0 ]; then
                echo "::error::the deployment failed (rolled back)"
                exit 1
              fi
            fi
            sleep 5
          done
          echo "::error::$GITHUB_SHA not served after 10 minutes (serving ${commit:-nothing})"
          exit 1
