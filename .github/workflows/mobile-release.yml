---
name: Mobile release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - mobile/**
      - .github/workflows/mobile-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Must match compileSdk / buildToolsVersion in app/build.gradle.kts.
          packages: platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          TYCHE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TYCHE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TYCHE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TYCHE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"
          mv app/build/outputs/apk/release/app-release.apk "tyche-$VERSION_NAME.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyche-${{ env.VERSION_NAME }}
          path: mobile/android/tyche-${{ env.VERSION_NAME }}.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--latest)
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "mobile-v$VERSION_NAME" "tyche-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Mobile $VERSION_NAME ($GITHUB_REF_NAME)" \
            --generate-notes \
            "${flags[@]}"
