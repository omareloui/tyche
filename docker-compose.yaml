---
services:
  tyche:
    container_name: tyche
    build:
      context: .
      dockerfile: ./build/package/Dockerfile
    init: true
    ports:
      - 3333:3333
    env_file:
      - path: ./.env
        required: true
    profiles:
      - prod
    volumes:
      - ./data:/usr/src/data
      - ./logs:/usr/src/logs
      - ./sql:/usr/src/sql
      - ./.cache:/usr/src/.cache

  tyche-dev:
    container_name: tyche-dev
    build:
      context: .
      dockerfile: ./build/package/dev.Dockerfile
    init: true
    ports:
      - 3333:3333
    env_file:
      - path: ./.env
        required: true
    profiles:
      - dev
    volumes:
      - ./data:/usr/src/data
    develop:
      watch:
        - action: rebuild
          path: ./go.sum
          target: /usr/src/go.sum
        - action: rebuild
          path: ./go.mod
          target: /usr/src/go.mod
        - action: rebuild
          path: ./.env
        - action: rebuild
          path: ./sqlc.yaml
          target: /usr/src/sqlc.yaml
        - action: rebuild
          path: ./sql
          target: /usr/src/sql
        - action: sync
          path: ./cmd
          target: /usr/src/cmd
        - action: sync
          path: ./Makefile
          target: /usr/src/Makefile
        - action: sync
          path: ./config
          target: /usr/src/config
        - action: sync
          path: ./internal
          target: /usr/src/internal
        - action: sync
          path: ./web
          target: /usr/src/web
