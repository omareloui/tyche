  financial-plans:
    container_name: financial-plans
    build:
      context: .
      dockerfile: ./build/package/Dockerfile
    init: true
    ports:
      - 3333:3333
    # depends_on:
    #   - db
    env_file:
      - path: ./.env
        required: true
    networks:
      - default
    profiles:
      - prod

  financial-plans-dev:
    container_name: financial-plans-dev
    build:
      context: .
      dockerfile: ./build/package/dev.Dockerfile
    init: true
    ports:
      - 3333:3333
    env_file:
      - path: ./.env
        required: true
    networks:
      - default
    profiles:
      - dev
    # depends_on:
    #   - db
    develop:
      watch:
        - action: rebuild
          path: ./go.sum
          target: /usr/src/go.sum
        - action: rebuild
          path: ./go.mod
          target: /usr/src/go.mod
        - action: rebuild
          path: ./.env
        - action: sync
          path: ./cmd
          target: /usr/src/cmd
        - action: sync
          path: ./Makefile
          target: /usr/src/Makefile
        - action: sync
          path: ./config
          target: /usr/src/config
        - action: sync
          path: ./internal
          target: /usr/src/internal
        - action: sync
          path: ./web
          target: /usr/src/web

networks:
  default:
volumes:
  db:
